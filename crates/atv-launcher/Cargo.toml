[package]
name = "atv-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
atv-hd = { version = "0.1.0", path = "../atv-hd" }
atv-lobby = { version = "0.1.0", path = "../atv-lobby" }
atv-formats = { version = "0.1.0", path = "../atv-formats" }
atv-sim = { version = "0.1.0", path = "../atv-sim" }
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"

[[bin]]
name = "atv2-launcher"
path = "src/main.rs"
